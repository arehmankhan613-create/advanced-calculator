<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

<div class="calculator">

<div class="top-bar">

<h2>
<i class="fa-solid fa-calculator"></i>
SmartCalc Pro
</h2>

<div class="top-buttons">

<button id="historyBtn" title="History">
<i class="fa-solid fa-clock-rotate-left"></i>
</button>

<button id="themeBtn" title="Theme">
🌙
</button>

</div>

</div>
</div>

<div class="tabs">

<button class="tab active" id="standardTab">
🧮 Calculator
</button>

<button class="tab" id="scienceTab">
🔬 Scientific
</button>

<button class="tab" id="currencyTab">
💱 Currency
</button>

</div>

<input
type="text"
id="display"
placeholder="0"
readonly>

<div class="buttons">

<button class="operator">AC</button>
<button class="operator">⌫</button>
<button class="operator">%</button>
<button class="operator">÷</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">×</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">−</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">+</button>

<button>.</button>
<button>0</button>
<button>=</button>
<button class="operator">Copy</button>

</div>

<!-- Scientific Calculator -->

<div id="scientificPanel" class="hidden">

<div class="science-grid">

<button>√</button>
<button>x²</button>
<button>x³</button>
<button>1/x</button>

<button>sin</button>
<button>cos</button>
<button>tan</button>

<button>log</button>

<button>ln</button>
<button>π</button>
<button>e</button>
<button>!</button>

</div>

</div>

<!-- Currency Converter -->

<div id="currencyPanel" class="hidden">

<h3>💱 Currency Converter</h3>

<input
type="number"
id="amount"
placeholder="Enter Amount">

<select id="fromCurrency">

<option>INR</option>
<option>USD</option>
<option>EUR</option>
<option>AED</option>
<option>GBP</option>

</select>

<select id="toCurrency">

<option>USD</option>
<option>INR</option>
<option>EUR</option>
<option>AED</option>
<option>GBP</option>

</select>

<button id="convertBtn">
Convert
</button>

<h2 id="currencyResult">
0.00
</h2>
<!-- History Panel -->

</div>


<script src="script.js"></script>

</body>
</html>
